<!-- templates/policy_analysis/upload.html -->
{% extends "forum/base.html" %}
{% block content %}
<h2>📥 Upload Policy Metadata</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label">Policy Metadata File (.json/.txt)</label>
        <input type="file" name="policy_file" accept=".json,.txt" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Section Metadata File (.json/.txt)</label>
        <input type="file" name="section_file" accept=".json,.txt" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary">Upload and Import</button>
</form>
{% endblock %}
