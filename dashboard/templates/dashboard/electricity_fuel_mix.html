{% extends "forum/base.html" %}
{% block content %}
<div class="container my-5">
  <h2>🧯 Fuel Mix by Country</h2>

  <form method="get" class="mb-4">
    <label for="country">🌍 Select Country:</label>
    <select name="country" class="form-control w-25 d-inline-block">
      {% for c in countries %}
        <option value="{{ c }}" {% if c == selected_country %}selected{% endif %}>{{ c }}</option>
      {% endfor %}
    </select>
    <button type="submit" class="btn btn-primary ml-2">Update</button>
  </form>

  <div class="row">
    <div class="col-md-6">
      <h5>📊 Fuel Mix – Plant Count (%)</h5>
      {{ fig1|safe }}
    </div>
    <div class="col-md-6">
      <h5>⚡ Fuel Mix – Installed Capacity (MW)</h5>
      {{ fig2|safe }}
    </div>
  </div>
</div>
{% endblock %}
