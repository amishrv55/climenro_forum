{% extends "forum/base.html" %}
{% block content %}
<div class="container my-5">
  <h2>🔍 Power Infrastructure Summary</h2>

  <form method="get" class="mb-4">
    <label for="country">🌍 Select Country:</label>
    <select name="country" class="form-control w-25 d-inline-block">
      {% for c in countries %}
        <option value="{{ c }}" {% if c == selected_country %}selected{% endif %}>{{ c }}</option>
      {% endfor %}
    </select>
    <button type="submit" class="btn btn-primary ml-2">Update</button>
  </form>

  <div class="alert alert-info">
    <strong>Total Installed Capacity for {{ selected_country }}:</strong> {{ total_capacity }} MW
  </div>

  <h4 class="mt-4">⚡ Power Plants Details</h4>
  <div class="table-responsive">
    {{ table_html|safe }}
  </div>
</div>
{% endblock %}
