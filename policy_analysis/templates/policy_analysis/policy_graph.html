{% extends "forum/base.html" %}
{% block content %}
<h2>📊 Policy Knowledge Graph</h2>
<svg width="1000" height="600"></svg>

<form method="get">
  <label>Select Country:</label>
  <select name="country" onchange="this.form.submit()">
    <option value="">All</option>
    <option value="IN" {% if country == "IN" %}selected{% endif %}>India</option>
    <option value="US" {% if country == "US" %}selected{% endif %}>USA</option>
    <option value="SG" {% if country == "SG" %}selected{% endif %}>Singapore</option>
  </select>
</form>

<!-- JSON data for nodes and links -->
<script id="nodes-data" type="application/json">{{ nodes_json|safe }}</script>
<script id="links-data" type="application/json">{{ links_json|safe }}</script>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
    const nodes = JSON.parse(document.getElementById("nodes-data").textContent);
    const links = JSON.parse(document.getElementById("links-data").textContent);

    const svg = d3.select("svg");
    const width = +svg.attr("width");
    const height = +svg.attr("height");

    const simulation = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links).id(d => d.id).distance(200))
        .force("charge", d3.forceManyBody().strength(-500))
        .force("center", d3.forceCenter(width / 2, height / 2));

    const link = svg.append("g")
        .attr("stroke", "#aaa")
        .selectAll("line")
        .data(links)
        .join("line")
        .attr("stroke-width", d => d.score * 5);

    const node = svg.append("g")
        .attr("stroke", "#fff")
        .attr("stroke-width", 1.5)
        .selectAll("circle")
        .data(nodes)
        .join("circle")
        .attr("r", 20)
        .attr("fill", "#3c8dbc")
        .call(drag(simulation));

    node.append("title")
        .text(d => d.title);

    const label = svg.append("g")
        .selectAll("text")
        .data(nodes)
        .join("text")
        .text(d => d.title)
        .attr("font-size", 12)
        .attr("x", 6)
        .attr("y", 3);

    simulation.on("tick", () => {
        link
            .attr("x1", d => d.source.x)
            .attr("y1", d => d.source.y)
            .attr("x2", d => d.target.x)
            .attr("y2", d => d.target.y);

        node
            .attr("cx", d => d.x)
            .attr("cy", d => d.y);

        label
            .attr("x", d => d.x + 10)
            .attr("y", d => d.y);
    });

    function drag(simulation) {
        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }

        return d3.drag()
            .on("start", dragstarted)
            .on("drag", dragged)
            .on("end", dragended);
    }
</script>
{% endblock %}
