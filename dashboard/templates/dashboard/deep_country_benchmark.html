{% extends "forum/base.html" %}
{% load static %}

{% block content %}
<div class="container my-5">
    <h2 class="mb-4">📏 Country Benchmarking</h2>
    <form method="get" class="mb-4">
        <label>Year:</label>
        <select name="year" class="form-control w-auto d-inline-block">
            {% for y in years %}
                <option value="{{ y }}" {% if y == selected_year %}selected{% endif %}>{{ y }}</option>
            {% endfor %}
        </select>
        <label class="ml-3">Country:</label>
        <select name="country" class="form-control w-auto d-inline-block">
            {% for c in countries %}
                <option value="{{ c }}" {% if c == selected_country %}selected{% endif %}>{{ c }}</option>
            {% endfor %}
        </select>
        <button type="submit" class="btn btn-primary ml-2">Update</button>
    </form>

    <div class="row text-center">
        <div class="col-md-4"><h5>Country Emissions</h5><p>{{ country_val }} MtCO₂e</p></div>
        <div class="col-md-4"><h5>Global Average</h5><p>{{ global_avg }} MtCO₂e</p></div>
        <div class="col-md-4"><h5>Difference</h5><p>{{ diff }} MtCO₂e ({{ diff_pct }}%)</p></div>
    </div>
</div>
{% endblock %}
