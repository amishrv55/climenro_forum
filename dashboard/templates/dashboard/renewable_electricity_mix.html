{% extends "forum/base.html" %}
{% block content %}
<div class="container">
    <h2>🔌 Electricity Mix – {{ selected_country }} ({{ selected_year }})</h2>
    <form method="get" class="row g-3 my-3">
        <div class="col-md-6">
            <label for="country">Select Country:</label>
            <select name="country" class="form-select">
                {% for c in countries %}
                    <option value="{{ c }}" {% if c == selected_country %}selected{% endif %}>{{ c }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-4">
            <label for="year">Select Year:</label>
            <select name="year" class="form-select">
                {% for y in years %}
                    <option value="{{ y }}" {% if y == selected_year %}selected{% endif %}>{{ y }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-2 align-self-end">
            <button type="submit" class="btn btn-primary">Update</button>
        </div>
    </form>
    {% if chart %}
    <div class="my-4 text-center">
        <img src="data:image/png;base64,{{ chart }}" class="img-fluid shadow" alt="Renewable Breakdown Chart">
    </div>
    {% else %}
    <div class="alert alert-warning">No data available for this country and year.</div>
    {% endif %}
</div>
{% endblock %}
