{% extends "forum/base.html" %}
{% block content %}
<div class="container">
    <h2>📈 Renewable Share Over Time – {{ selected_country }}</h2>
    <form method="get" class="row g-3 my-3">
        <div class="col-md-6">
            <label for="country">Select Country:</label>
            <select name="country" class="form-select">
                {% for c in countries %}
                    <option value="{{ c }}" {% if c == selected_country %}selected{% endif %}>{{ c }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-2 align-self-end">
            <button type="submit" class="btn btn-primary">Update</button>
        </div>
    </form>
    {% if chart %}
        <div class="my-4">{{ chart|safe }}</div>
    {% else %}
        <div class="alert alert-warning">No data available for selected country.</div>
    {% endif %}
</div>
{% endblock %}
