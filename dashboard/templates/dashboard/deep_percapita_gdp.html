{% extends "forum/base.html" %}
{% block content %}
<div class="container my-5">
  <h2>👥 Per Capita & GDP Efficiency</h2>

  <form method="get" class="mb-4">
    <label>Select Country:</label>
    <select name="country" class="form-control w-25 d-inline-block">
      {% for c in countries %}
        <option value="{{ c }}" {% if c == selected_country %}selected{% endif %}>{{ c }}</option>
      {% endfor %}
    </select>
    <button class="btn btn-primary ml-2">🔍 Show</button>
  </form>

  <hr class="my-4">

  <h4>📈 Per Capita Emissions</h4>
  <div class="mb-5">
    {{ fig_pc|safe }}
  </div>

  <h4>💰 Emission Efficiency per GDP</h4>
  <div>
    {{ fig_gdp|safe }}
  </div>
</div>
{% endblock %}
